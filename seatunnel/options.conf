#!/bin/bash
# SeaTunnel Options Configuration
# Author: OneinStack
# Project: https://github.com/oneinstack/oneinstack

# ===== 镜像源 =====
mirror_link=https://mirrors.oneinstack.com/oneinstack/src

# ===== 安装路径 =====
seatunnel_install_dir=/opt/seatunnel

# ===== 数据目录 =====
seatunnel_data_dir=/opt/seatunnel/data
seatunnel_log_dir=/opt/seatunnel/logs
seatunnel_checkpoint_dir=/opt/seatunnel/checkpoint

# ===== 运行用户 =====
run_user=seatunnel
run_group=seatunnel

# ===== 部署模式 =====
# local: 单机本地模式，每个任务启动独立进程
# hybrid: 混合集群模式，Master 和 Worker 在同一进程
# separated: 分离集群模式，Master 和 Worker 分离（生产推荐）
deploy_mode=hybrid

# ===== 集群配置 =====
cluster_name=seatunnel
# 集群成员列表（逗号分隔的 IP 地址）
cluster_members=127.0.0.1
# 当前节点角色（separated 模式下使用）: master / worker
node_role=master

# ===== 服务端口 =====
hazelcast_port=5801

# ===== JVM 配置 =====
jvm_heap_size=2g
jvm_metaspace_size=256m

# ===== 连接器配置 =====
# 需要安装的连接器列表（逗号分隔）
# 常用连接器: connector-fake,connector-console,connector-jdbc,connector-kafka,connector-cdc-mysql,connector-doris
connectors=connector-fake,connector-console

# ===== Checkpoint 配置 =====
checkpoint_interval=10000
checkpoint_timeout=60000
checkpoint_max_retained=3
# checkpoint 存储类型: localfile / hdfs
checkpoint_storage_type=localfile

# ===== 引擎配置 =====
# imap 备份数
imap_backup_count=1
# 历史作业过期时间（分钟）
history_job_expire_minutes=1440
# 作业调度策略: WAIT（等待资源）/ REJECT（拒绝任务，默认）
job_schedule_strategy=REJECT

# ===== 备份配置 =====
backup_dir=/data/backup/seatunnel
expired_days=7
# 备份目标: local,remote,oss,s3（逗号分隔）
backup_destination=local
# 备份内容: config,connectors,jobs（逗号分隔）
backup_content=config,connectors

# ===== 云存储配置（可选）=====
oss_bucket=
oss_endpoint=
s3_bucket=
s3_region=

# ===== 远程备份配置（可选）=====
remote_host=
remote_user=
remote_dir=

# ===== 监控告警配置 =====
alert_email=
webhook_url=

# ===== 自动生成（安装时填充）=====
seatunnel_installed=
java_home=
