# SSH 互信工具配置文件
# 项目: sshtrust
# 说明: 所有可配置参数的中央存储

# ===== SSH 互信配置 =====
ssh_user=root
ssh_port=22
ssh_key_type=rsa
ssh_key_bits=2048
ssh_key_file=~/.ssh/id_rsa

# ===== 互信模式 =====
# one-way: 控制机 → 多目标（本机免密登录远程机器）
# mesh:    全互信（所有机器互相免密登录）
trust_mode=mesh

# ===== 互信主机列表 =====
# 空格分隔，格式: host 或 user@host:port（覆盖默认用户/端口）
# 注意: 值含空格，必须用双引号包裹，否则 source 时会被当成命令执行
# 示例: "192.168.1.10 192.168.1.11 root@192.168.1.12:2222"
trust_hosts=""
