# Apache Doris FE Configuration Template
# DorisStack - Auto-generated configuration
# For full configuration reference:
# https://doris.apache.org/docs/admin-manual/config/fe-config/

#####################################################################
# Java options
#####################################################################
JAVA_OPTS="-Xmx8g -XX:+UseMembar -XX:SurvivorRatio=8 -XX:MaxTenuringThreshold=7 -XX:+PrintGCDateStamps -XX:+PrintGCDetails -XX:+UseConcMarkSweepGC -XX:+UseParNewGC -XX:+CMSClassUnloadingEnabled -XX:-CMSParallelRemarkEnabled -XX:CMSInitiatingOccupancyFraction=80 -XX:SoftRefLRUPolicyMSPerMB=0 -Xloggc:$DORIS_HOME/log/fe.gc.log.$DATE"

# For JDK 17+, use the following instead:
JAVA_OPTS_FOR_JDK_17="-Xmx8g -Djavax.security.auth.useSubjectCredsOnly=false -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xloggc:$DORIS_HOME/log/fe.gc.log.$DATE"

#####################################################################
# Network
#####################################################################
# priority_networks = 10.1.3.0/24

# HTTP port for FE web UI
http_port = 8030

# Thrift RPC port
rpc_port = 9020

# MySQL protocol query port
query_port = 9030

# FE edit log port for internal communication
edit_log_port = 9010

#####################################################################
# Metadata
#####################################################################
# meta_dir = ${DORIS_HOME}/doris-meta

#####################################################################
# Case sensitivity (cannot change after cluster init)
# 0 = case sensitive (default)
# 1 = case insensitive (recommended)
# 2 = case insensitive for table names only
#####################################################################
lower_case_table_names = 1

#####################################################################
# Logging
#####################################################################
# sys_log_level = INFO
# sys_log_dir = ${DORIS_HOME}/log
# audit_log_dir = ${DORIS_HOME}/log

#####################################################################
# Others
#####################################################################
# max_conn_per_user = 100
# qe_max_connection = 1024
