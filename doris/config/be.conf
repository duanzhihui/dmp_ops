# Apache Doris BE Configuration Template
# DorisStack - Auto-generated configuration
# For full configuration reference:
# https://doris.apache.org/docs/admin-manual/config/be-config/

#####################################################################
# Java options (for BE internal JVM)
#####################################################################
JAVA_OPTS="-Xmx2g -DlogPath=$DORIS_HOME/log/jni.log -Xloggc:$DORIS_HOME/log/be.gc.log.$DATE -Djavax.security.auth.useSubjectCredsOnly=false"

JAVA_OPTS_FOR_JDK_17="-Xmx2g -DlogPath=$DORIS_HOME/log/jni.log -Xloggc:$DORIS_HOME/log/be.gc.log.$DATE -Djavax.security.auth.useSubjectCredsOnly=false --add-opens=java.base/java.nio=ALL-UNNAMED"

#####################################################################
# Network
#####################################################################
# priority_networks = 10.1.3.0/24

# BE HTTP port for web UI
webserver_port = 8040

# Heartbeat service port (used by FE to manage BE)
heartbeat_service_port = 9050

# BRPC port for internal communication
brpc_port = 8060

# BE thrift port
be_port = 9060

#####################################################################
# Storage
#####################################################################
# Storage root path. Multiple paths separated by semicolons.
# Format: path,medium:HDD or path,medium:SSD
# storage_root_path = /data/doris/be-storage,medium:HDD

# Trash file keep time (seconds), default 86400 (1 day)
# trash_file_expire_time_sec = 86400

#####################################################################
# Memory
#####################################################################
# BE process memory limit (percentage of total memory or absolute value)
# mem_limit = 80%

# Chunk allocator capacity
# chunk_reserved_bytes_limit = 20%

#####################################################################
# Compaction
#####################################################################
# cumulative_compaction_num_threads_per_disk = 1
# base_compaction_num_threads_per_disk = 1
# max_compaction_concurrency = 10

#####################################################################
# Logging
#####################################################################
# sys_log_level = INFO
# sys_log_dir = ${DORIS_HOME}/log
