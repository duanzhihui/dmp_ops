# Apache Doris Deployment Configuration
# Project: DorisStack - Apache Doris Cluster Deployment Tool
#
# Deployment modes:
#   standalone  - FE + BE on single node (default)
#   integrated  - 存算一体集群 (FE cluster + BE cluster)
#   separated   - 存算分离集群 (FDB + MS + FE + BE + Storage Vault, 3.x+ only)

#########################################################################
# Mirror link for downloading Doris packages
# Package: apache-doris-<ver>-bin-<arch>.tar.gz (unified for ALL versions)
mirror_link=https://downloads.apache.org/doris
archive_mirror_link=https://archive.apache.org/dist/doris
velodb_mirror_link=https://download.velodb.io

# set the default timezone
timezone=Asia/Shanghai

#########################################################################
# Doris run user (Default "doris")
run_user=doris
run_group=doris

#########################################################################
# Installation directories
doris_home=/opt/doris
fe_install_dir=/opt/doris/fe
be_install_dir=/opt/doris/be
ms_install_dir=/opt/doris/ms

# Data directories
fe_meta_dir=/data/doris/fe-meta
be_data_dir=/data/doris/be-storage

# Log directories
fe_log_dir=/data/doris/fe-log
be_log_dir=/data/doris/be-log
ms_log_dir=/data/doris/ms-log

#########################################################################
# FE Configuration
fe_http_port=8030
fe_rpc_port=9020
fe_query_port=9030
fe_edit_log_port=9010

# FE Java Heap (recommend 16G+ for production)
fe_java_heap=8g

# FE lower_case_table_names (1=case insensitive, cannot change after init)
fe_lower_case_table_names=1

#########################################################################
# BE Configuration
be_heartbeat_service_port=9050
be_brpc_port=8060
be_webserver_port=8040

# BE storage medium: HDD or SSD
be_storage_medium=HDD

# BE Java Heap (recommend 2G+ for production)
be_java_heap=2g

#########################################################################
# Network CIDR (e.g. 10.1.3.0/24), auto-detect if empty
priority_networks=

#########################################################################
# JAVA_HOME path (auto-detect if empty)
JAVA_HOME=

#########################################################################
# Cluster Configuration
# Deployment mode: standalone, integrated, separated
deploy_mode=standalone

# FE nodes (comma separated, format: ip:edit_log_port)
# First node is Master, others are Follower
# e.g. fe_nodes="192.168.1.1:9010,192.168.1.2:9010,192.168.1.3:9010"
fe_nodes=

# BE nodes (comma separated, format: ip:heartbeat_service_port)
# e.g. be_nodes="192.168.1.4:9050,192.168.1.5:9050,192.168.1.6:9050"
be_nodes=

#########################################################################
# 存算分离 (Separating Storage-Compute) Configuration
# Only used when deploy_mode=separated, requires Doris 3.x+

# FoundationDB (FDB) nodes (comma separated IPs, first is coordinator)
# At least 3 nodes for production; single node for dev/test
# e.g. fdb_nodes="192.168.1.10,192.168.1.11,192.168.1.12"
fdb_nodes=

# FDB home directory
fdb_home=/opt/fdb
# FDB data directories (comma separated)
fdb_data_dirs=/data/fdb/data1
# FDB cluster description
fdb_cluster_desc=dorisfdb
# FDB cluster ID (auto-generated if empty)
fdb_cluster_id=

# Meta Service (MS) nodes (comma separated, format: ip:port)
# At least 3 nodes for production
# e.g. ms_nodes="192.168.1.10:5000,192.168.1.11:5000,192.168.1.12:5000"
ms_nodes=

# Meta Service brpc listen port
ms_brpc_port=5000

# FDB cluster connection string (auto-populated after FDB deployment)
fdb_cluster=

# Cluster ID for separating storage-compute (auto-generated if empty)
cloud_cluster_id=

# Storage Vault type: S3, HDFS (configured after cluster is up)
storage_vault_type=S3

# S3 configuration (for Storage Vault)
s3_endpoint=
s3_access_key=
s3_secret_key=
s3_region=
s3_bucket=
s3_root_path=doris-data
s3_provider=S3

# HDFS configuration (for Storage Vault)
hdfs_defaultfs=

#########################################################################
# Doris root password (auto-generated if empty)
doris_root_pwd=

# SSH settings for remote deployment
ssh_port=22
ssh_user=root
# SSH key file path (empty means use password)
ssh_key_file=
