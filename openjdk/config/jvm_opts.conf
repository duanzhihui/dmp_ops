# JVM 推荐参数模板
# 项目: dmp_ops/openjdk
#
# 供业务组件(ZooKeeper / Doris / DolphinScheduler / SeaTunnel / Tomcat 等)引用
# 使用方式: . /path/to/jvm_opts.conf && export JAVA_OPTS="${JDK17_OPTS}"
# 堆大小请按实际内存调整(建议不超过物理内存的 50%~70%)

# ===== JDK 8 =====
# 8 无统一 -Xlog，GC 日志使用 -Xloggc 系列参数
JDK8_OPTS="-server -Xms2g -Xmx2g \
-XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/openjdk \
-Xloggc:/var/log/openjdk/gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps \
-XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=10 -XX:GCLogFileSize=32M \
-Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"

# ===== JDK 11 / 17 =====
JDK11_OPTS="-server -Xms2g -Xmx2g \
-XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/openjdk \
-Xlog:gc*:file=/var/log/openjdk/gc.log:time,uptime,level,tags:filecount=10,filesize=32M \
-Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"

JDK17_OPTS="${JDK11_OPTS}"

# ===== JDK 18 (非 LTS，参数同 17) =====
JDK18_OPTS="${JDK11_OPTS}"

# ===== JDK 21 (可选分代 ZGC，低延迟场景) =====
JDK21_OPTS="-server -Xms4g -Xmx4g \
-XX:+UseZGC -XX:+ZGenerational \
-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/openjdk \
-Xlog:gc*:file=/var/log/openjdk/gc.log:time,uptime,level,tags:filecount=10,filesize=32M \
-Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"

# JDK 21 若偏好吞吐稳定，可继续使用 G1:
JDK21_G1_OPTS="-server -Xms4g -Xmx4g \
-XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/openjdk \
-Xlog:gc*:file=/var/log/openjdk/gc.log:time,uptime,level,tags:filecount=10,filesize=32M \
-Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"

# ===== 容器环境补充参数(JDK 8u191+ / 11+ 均支持) =====
CONTAINER_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0"
