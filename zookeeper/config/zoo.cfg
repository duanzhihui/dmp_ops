# ZooKeeper Configuration Template
# Generated by oneinstack/zookeeper

# 基础配置
# tickTime: ZooKeeper 使用的基本时间单位（毫秒）
tickTime=2000

# initLimit: Follower 连接到 Leader 并同步的超时时间（tickTime 的倍数）
initLimit=10

# syncLimit: Follower 与 Leader 同步的超时时间（tickTime 的倍数）
syncLimit=5

# 数据目录
# dataDir: 存储内存数据库快照的位置
dataDir=/data/zookeeper

# dataLogDir: 事务日志目录（建议与 dataDir 分开，使用 SSD）
dataLogDir=/data/zookeeper/logs

# 客户端端口
clientPort=2181

# Admin Server (3.5.0+)
# 管理接口，提供 HTTP 端点
admin.serverPort=8080
admin.enableServer=true

# 四字命令白名单
# 允许所有四字命令（生产环境建议限制）
4lw.commands.whitelist=*

# 自动清理快照和日志
# autopurge.snapRetainCount: 保留的快照数量
autopurge.snapRetainCount=3
# autopurge.purgeInterval: 清理间隔（小时），0 表示禁用
autopurge.purgeInterval=1

# 最大客户端连接数
# 0 表示不限制
maxClientCnxns=60

# 会话超时限制
# minSessionTimeout=4000
# maxSessionTimeout=40000

# 集群配置示例（取消注释并修改）
