#!/bin/bash
# MySQL 运维脚本中央配置文件
# Author: DMP OPS
# 
# 说明: 所有可配置参数集中管理，安装/备份/监控脚本均从此文件读取配置

# ===== 镜像源配置 =====
mirror_link=https://mirrors.oneinstack.com

# ===== 安装路径配置 =====
mysql_install_dir=/usr/local/mysql
mysql_data_dir=/data/mysql

# ===== 运行用户 =====
run_user=mysql

# ===== 数据库密码（安装时自动生成）=====
dbrootpwd=

# ===== 安装方式 =====
# 1 = 二进制安装（默认，推荐）
# 2 = 源码编译安装
dbinstallmethod=1

# ===== 备份配置 =====
backup_dir=/data/backup
expired_days=5
# 备份目标: local,remote,oss,cos,s3 (逗号分隔支持多目标)
backup_destination=local
# 要备份的数据库名 (逗号分隔)
db_name=

# ===== 远程备份配置 =====
remote_host=
remote_port=22
remote_user=root
remote_dir=/data/backup

# ===== 阿里云 OSS 配置 =====
oss_endpoint=
oss_bucket=
oss_access_key_id=
oss_access_key_secret=

# ===== 腾讯云 COS 配置 =====
cos_region=
cos_bucket=
cos_secret_id=
cos_secret_key=

# ===== AWS S3 配置 =====
s3_region=
s3_bucket=
s3_access_key=
s3_secret_key=

# ===== 监控告警配置 =====
log_dir=/var/log/mysql_ops
# 告警邮箱 (留空则不发送邮件)
alert_email=
# Webhook URL (支持钉钉/企业微信/Slack等)
webhook_url=

# ===== 监控阈值 =====
# 连接数使用率告警阈值 (百分比)
conn_threshold=80
# 磁盘使用率告警阈值 (百分比)
disk_threshold=85
# 复制延迟告警阈值 (秒)
repl_lag_threshold=60
# 慢查询数量告警阈值
slow_query_threshold=100
